[project]
name = "mars-rover"
version = "0.1.0"
description = "Simulateur de Mars Rover"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mars_rover*"]

[project.scripts]
mars-rover = "mars_rover.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
